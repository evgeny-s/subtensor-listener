<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0EA5B7"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="face" x1="160" y1="170" x2="352" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#CBD5E1"/>
    </linearGradient>
    <radialGradient id="eye" cx="0.5" cy="0.4" r="0.7">
      <stop stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#0891B2"/>
    </radialGradient>
  </defs>

  <!-- rounded-square app background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- broadcast / signal waves: the listener tuning into the network -->
  <g stroke="#BAE6FD" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M300 120 a44 44 0 0 1 62 0" stroke-width="12"/>
    <path d="M286 96 a72 72 0 0 1 104 0" stroke-width="12" opacity="0.7"/>
    <path d="M272 72 a100 100 0 0 1 146 0" stroke-width="12" opacity="0.45"/>
  </g>

  <!-- antenna -->
  <line x1="256" y1="150" x2="256" y2="196" stroke="#0F172A" stroke-width="14" stroke-linecap="round"/>
  <circle cx="256" cy="142" r="18" fill="#FACC15" stroke="#0F172A" stroke-width="6"/>

  <!-- head -->
  <rect x="148" y="188" width="216" height="180" rx="44" fill="url(#face)" stroke="#0F172A" stroke-width="12"/>

  <!-- ear / headphone cups (listening) -->
  <rect x="112" y="240" width="44" height="84" rx="20" fill="#0F172A"/>
  <rect x="356" y="240" width="44" height="84" rx="20" fill="#0F172A"/>

  <!-- eyes -->
  <circle cx="212" cy="268" r="30" fill="url(#eye)" stroke="#0F172A" stroke-width="8"/>
  <circle cx="300" cy="268" r="30" fill="url(#eye)" stroke="#0F172A" stroke-width="8"/>
  <circle cx="212" cy="262" r="9" fill="#ECFEFF"/>
  <circle cx="300" cy="262" r="9" fill="#ECFEFF"/>

  <!-- mouth: a small block / data row, nodding to blockchain -->
  <g fill="#0F172A">
    <rect x="196" y="318" width="22" height="22" rx="6"/>
    <rect x="226" y="318" width="22" height="22" rx="6"/>
    <rect x="256" y="318" width="22" height="22" rx="6"/>
    <rect x="286" y="318" width="22" height="22" rx="6" opacity="0.55"/>
  </g>
</svg>
