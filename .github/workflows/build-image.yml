name: Build image

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Dockerfile"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "nest-cli.json"
      - ".github/workflows/build-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tao-com-official/subtensor-listener
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build_image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image_tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate image tag
        id: vars
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          EPOCH_TIME=$(date +%s)
          TAG="${COMMIT_HASH}-${EPOCH_TIME}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using tag: $TAG"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  promote_prod:
    runs-on: ubuntu-latest
    needs: build_image
    if: github.ref_name == 'main' && github.actor != 'dependabot[bot]'
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag as prod
        id: promote
        run: |
          docker buildx imagetools create \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:prod-${{ needs.build_image.outputs.image_tag }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build_image.outputs.image_tag }}
          echo "promote_tag=prod-${{ needs.build_image.outputs.image_tag }}" >> "$GITHUB_OUTPUT"
          echo "Pushed prod-${{ needs.build_image.outputs.image_tag }}"

      - name: Update image tag in versions repo
        run: |
          git clone https://x-access-token:${{ secrets.VERSIONS_PAT }}@github.com/tao-com-official/versions.git versions-repo
          cd versions-repo
          git config user.email "ci@tao.com"
          git config user.name "GitHub Actions"
          yq e '.image.tag = "${{ steps.promote.outputs.promote_tag }}"' -i prod/subtensor-listener/values.yaml
          git add prod/subtensor-listener/values.yaml
          git commit -m "chore: update prod-subtensor-listener image to ${{ steps.promote.outputs.promote_tag }}"
          git push
